services:
  mongodb:
    image: mongo:8.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: cloudapp
    volumes:
      - mongodb_data:/data/db
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend1:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/cloudapp
      JWT_SECRET: ${JWT_SECRET:-development_only_change_this_secret}
      NODE_ENV: development
      RESET_URL_BASE: http://localhost:8081
      INSTANCE_ID: backend-1
      BACKEND_HEALTH_URLS: "backend-1=http://backend1:5000/api/health,backend-2=http://backend2:5000/api/health,backend-3=http://backend3:5000/api/health"
      MIN_TEMPERATURE_C: ${MIN_TEMPERATURE_C:--40}
      MAX_TEMPERATURE_C: ${MAX_TEMPERATURE_C:-80}
      MIN_HUMIDITY_PERCENT: ${MIN_HUMIDITY_PERCENT:-0}
      MAX_HUMIDITY_PERCENT: ${MAX_HUMIDITY_PERCENT:-100}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/api/health').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend2:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/cloudapp
      JWT_SECRET: ${JWT_SECRET:-development_only_change_this_secret}
      NODE_ENV: development
      RESET_URL_BASE: http://localhost:8081
      INSTANCE_ID: backend-2
      BACKEND_HEALTH_URLS: "backend-1=http://backend1:5000/api/health,backend-2=http://backend2:5000/api/health,backend-3=http://backend3:5000/api/health"
      MIN_TEMPERATURE_C: ${MIN_TEMPERATURE_C:--40}
      MAX_TEMPERATURE_C: ${MAX_TEMPERATURE_C:-80}
      MIN_HUMIDITY_PERCENT: ${MIN_HUMIDITY_PERCENT:-0}
      MAX_HUMIDITY_PERCENT: ${MAX_HUMIDITY_PERCENT:-100}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/api/health').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend3:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/cloudapp
      JWT_SECRET: ${JWT_SECRET:-development_only_change_this_secret}
      NODE_ENV: development
      RESET_URL_BASE: http://localhost:8081
      INSTANCE_ID: backend-3
      BACKEND_HEALTH_URLS: "backend-1=http://backend1:5000/api/health,backend-2=http://backend2:5000/api/health,backend-3=http://backend3:5000/api/health"
      MIN_TEMPERATURE_C: ${MIN_TEMPERATURE_C:--40}
      MAX_TEMPERATURE_C: ${MAX_TEMPERATURE_C:-80}
      MIN_HUMIDITY_PERCENT: ${MIN_HUMIDITY_PERCENT:-0}
      MAX_HUMIDITY_PERCENT: ${MAX_HUMIDITY_PERCENT:-100}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/api/health').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend-test:
    profiles: ["test"]
    build:
      context: ./backend
      target: test
    environment:
      NODE_ENV: test
      MIN_TEMPERATURE_C: ${MIN_TEMPERATURE_C:--40}
      MAX_TEMPERATURE_C: ${MAX_TEMPERATURE_C:-80}
      MIN_HUMIDITY_PERCENT: ${MIN_HUMIDITY_PERCENT:-0}
      MAX_HUMIDITY_PERCENT: ${MAX_HUMIDITY_PERCENT:-100}

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      backend1:
        condition: service_healthy
      backend2:
        condition: service_healthy
      backend3:
        condition: service_healthy
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_started
      backend1:
        condition: service_healthy
      backend2:
        condition: service_healthy
      backend3:
        condition: service_healthy
    networks:
      - app-network

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=2GB
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      backend1:
        condition: service_healthy
      backend2:
        condition: service_healthy
      backend3:
        condition: service_healthy
    networks:
      - app-network
    mem_limit: 512m
    cpus: 0.50
    healthcheck:
      test: ["CMD", "promtool", "check", "ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:?Set GRAFANA_ADMIN_USER in the root .env file}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in the root .env file}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - app-network
    mem_limit: 384m
    cpus: 0.50
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  app-network:
    driver: bridge

volumes:
  mongodb_data:
  prometheus_data:
  grafana_data: